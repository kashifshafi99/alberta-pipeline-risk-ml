name: Refresh CER data

# Pulls the latest incident file from the Canada Energy Regulator every
# Monday, commits it if it changed, and redeploys the dashboard.
on:
  schedule:
    - cron: "17 14 * * 1"   # Mondays, 8:17 am Calgary (MDT)
  workflow_dispatch:         # "Run workflow" button for a manual refresh

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download latest CER data
        run: python scripts/update_cer_data.py
      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add dashboard/public/pipeline-incidents-comprehensive-data.csv
            git commit -m "Refresh CER incident data ($(date -u +%Y-%m-%d))"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # A push made with the workflow's own token doesn't trigger other
  # workflows, so call the deploy workflow directly.
  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-dashboard.yml
